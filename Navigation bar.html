<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Navigation Bar</title>
<style>
  :root {
    --nav-bg: #14213d;
    --text: #ffffff;
    --accent: #fca311;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fa;
    color: #1b2430;
  }

  /* ---------- Navbar ---------- */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 64px;
    background: var(--nav-bg);
    color: var(--text);
  }
  .logo {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }
  .logo span { color: var(--accent); }

  .menu {
    display: flex;
    list-style: none;
    gap: 8px;
  }
  .menu a {
    display: block;
    padding: 8px 14px;
    color: var(--text);
    text-decoration: none;
    border-radius: 6px;
    transition: background 0.2s, color 0.2s;
  }
  .menu a:hover,
  .menu a.active { background: rgba(255, 255, 255, 0.12); color: var(--accent); }

  /* Hamburger button (hidden on desktop) */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    padding: 8px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .hamburger span {
    width: 26px;
    height: 3px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* ---------- Mobile ---------- */
  @media (max-width: 768px) {
    .hamburger { display: flex; }
    .menu {
      position: absolute;
      top: 64px;
      left: 0;
      width: 100%;
      flex-direction: column;
      gap: 0;
      background: var(--nav-bg);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .menu.open { max-height: 320px; }
    .menu a { padding: 16px 24px; border-radius: 0; }
  }

  /* ---------- Demo content ---------- */
  .content { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
  .content h1 { margin-bottom: 12px; }
  .content p { line-height: 1.6; color: #555; }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">My<span>Site</span></a>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="menu" id="menu">
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main class="content">
    <h1>Welcome</h1>
    <p>Resize the browser window (or open this on your phone) to see the menu switch between a full bar and a hamburger menu.</p>
  </main>

  <script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.getElementById('menu');

    // Open / close the menu
    hamburger.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
    });

    // Close the menu after tapping a link, and mark it active
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        menu.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
        menu.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', false);
      });
    });
  </script>
</body>
</html>
